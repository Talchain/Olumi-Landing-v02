name: Verify isolated Olumi Netlify preview
on:
  push:
    branches: ['codex/olumi-access-preview-v3']
    paths: ['netlify-access-preview/**', '.github/workflows/netlify-access-preview.yml']
permissions:
  contents: read
jobs:
  verify-hosted-page:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: netlify-access-preview
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare isolated verification directory
        run: |
          cp -R netlify-access-preview "$RUNNER_TEMP/olumi-live"
          export OLUMI_TOOLS="$RUNNER_TEMP/olumi-deploy-tools"
          echo "OLUMI_TOOLS=$OLUMI_TOOLS" >> "$GITHUB_ENV"
          npm install --no-save --no-audit --no-fund --prefix "$OLUMI_TOOLS" playwright@1.56.1
      - name: Test exact submission adapter
        run: node --test "$RUNNER_TEMP/olumi-live/tests/submission.test.mjs"
      - name: Verify the site already deployed
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const root=path.join(process.env.RUNNER_TEMP,'olumi-live');
          const original=fs.readFileSync(path.join(root,'scripts/deploy-and-test.cjs'),'utf8');
          let tests=original.slice(original.indexOf('const checks=[];'));
          const prefix=`const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict');
          const root=path.resolve(__dirname,'..'),out=path.join(root,'evidence');fs.mkdirSync(out,{recursive:true});
          const {chromium}=require(path.join(process.env.OLUMI_TOOLS,'node_modules/playwright'));
          const base='https://darling-tiramisu-f9f53a.netlify.app';
          const publicInfo={url:base,siteId:'d7509b96-7c99-4659-aa09-e4715f9d3ea0',deployId:'6acc2d4a9ec633e93677c9a2',deployedAt:'2026-10-12T00:43:57Z',claimRequired:true,commit:process.env.GITHUB_SHA};
          fs.writeFileSync(path.join(out,'public-deploy.json'),JSON.stringify(publicInfo,null,2));
          `;
          tests=tests.replace('const response=await page.goto','let response=await page.goto');
          tests=tests.replace(" check('HTTPS page loads'",` if(await page.locator('input[type=password]').count()){
            console.log('TEMPORARY_NETLIFY_PASSWORD_SCREEN='+await page.locator('body').innerText());
            await page.locator('input[type=password]').fill('My-Drop-Site');
            const submit=page.getByRole('button',{name:'Submit',exact:true});
            if(await submit.count()!==1){
              await page.screenshot({path:path.join(out,'password-screen.png'),fullPage:true});
              console.log('PASSWORD_FORM_CONTROLS='+JSON.stringify(await page.locator('button,input').evaluateAll(es=>es.map(e=>({tag:e.tagName,type:e.type,text:e.textContent,aria:e.getAttribute('aria-label')})))));
              throw new Error('Password submit control not uniquely identified.');
            }
            await submit.click();
            await page.locator('#request-button').waitFor({state:'visible',timeout:30000});
            response=await page.goto(base+'/?source=investor-deck',{waitUntil:'networkidle'});
          }
           check('HTTPS page loads'`);
          tests=tests.replace("{javaScriptEnabled:false}","{javaScriptEnabled:false,storageState:await context.storageState()}");
          fs.writeFileSync(path.join(root,'scripts/verify-live.cjs'),prefix+tests);
          NODE
          node "$RUNNER_TEMP/olumi-live/scripts/verify-live.cjs"
      - name: Package exact deployed source
        if: always()
        run: |
          cd "$RUNNER_TEMP/olumi-live"
          mkdir -p evidence
          zip -qr evidence/deployed-source.zip site netlify.toml tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: olumi-access-preview-evidence
          path: ${{ runner.temp }}/olumi-live/evidence/
          retention-days: 7
          if-no-files-found: warn
